name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/wnrs-astro-marketing-site-2e72
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Do not bind this job to the github-pages environment: that environment
    # currently allows only `main`, so Actions from this PR branch is rejected.
    # actions/deploy-pages still publishes with pages:write + id-token:write.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
