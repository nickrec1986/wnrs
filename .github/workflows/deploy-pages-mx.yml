# Host-rooted Spanish site for wnrs.com.mx.
# Does not deploy to this repo's Pages (that remains English wnrs.com).
# After creating nickrec1986/wnrs-mx with Pages + custom domain wnrs.com.mx,
# add a GH_PAGES_MX_TOKEN secret and uncomment the publish step.
name: Build wnrs.com.mx artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:mx
      - uses: actions/upload-artifact@v4
        with:
          name: wnrs-com-mx
          path: dist-mx
